<div *ngIf="isOpen" class="fixed inset-0 z-[100] overflow-y-auto">
      <div class="fixed inset-0 bg-black/50 backdrop-blur-sm transition-opacity" (click)="close()"></div>

      <div class="flex min-h-full items-center justify-center p-4">
        <div class="relative w-full max-w-md transform overflow-hidden rounded-2xl bg-white p-6 shadow-2xl transition-all">
          <div class="flex items-center justify-between mb-6">
            <h3 class="text-xl font-bold text-gray-900">{{ title }}</h3>
            <button (click)="close()" class="text-gray-400 hover:text-gray-600 transition-colors">
              <i class="fas fa-times text-lg"></i>
            </button>
          </div>

          <ng-content></ng-content>
        </div>
      </div>
    </div>
