<app-shared-modal
  [isOpen]="isOpen"
  title="Add New Staff Member"
  (closeExited)="onClose()">

  <form class="space-y-5">
    <div>
      <label class="block text-sm font-bold text-gray-700 mb-1.5">Full Name</label>
      <div class="relative">
        <i class="fas fa-user absolute left-4 top-3.5 text-gray-400"></i>
        <input type="text"
               class="w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition-all"
               placeholder="Enter full name">
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-bold text-gray-700 mb-1.5">Role</label>
        <input type="text"
               class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none"
               placeholder="e.g. Manager">
      </div>
      <div>
        <label class="block text-sm font-bold text-gray-700 mb-1.5">Department</label>
        <select class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none bg-white appearance-none">
          <option>Reception</option>
          <option>Kitchen</option>
          <option>Maintenance</option>
          <option>Security</option>
        </select>
      </div>
    </div>

    <div>
      <label class="block text-sm font-bold text-gray-700 mb-1.5">Email Address</label>
      <div class="relative">
        <i class="fas fa-envelope absolute left-4 top-3.5 text-gray-400"></i>
        <input type="email"
               class="w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none"
               placeholder="staff@luxestay.com">
      </div>
    </div>

    <div>
      <label class="block text-sm font-bold text-gray-700 mb-2">Assign Shift</label>
      <div class="flex gap-2">
        <button
          type="button"
          (click)="selectShift(StaffShift.Morning)"
          [ngClass]="selectedShift === StaffShift.Morning ? 'bg-blue-50 text-blue-600 border-blue-600' : 'bg-gray-50 text-gray-500 border-transparent'"
          class="flex-1 py-2.5 border-2 rounded-xl font-bold text-xs flex flex-col items-center gap-1 transition-all duration-200">
          <i class="fas fa-sun"></i> Morning
        </button>

        <button
          type="button"
          (click)="selectShift(StaffShift.Afternoon)"
          [ngClass]="selectedShift === StaffShift.Afternoon ? 'bg-blue-50 text-blue-600 border-blue-600' : 'bg-gray-50 text-gray-500 border-transparent'"
          class="flex-1 py-2.5 border-2 rounded-xl font-bold text-xs flex flex-col items-center gap-1 transition-all duration-200">
          <i class="fas fa-cloud-sun"></i> Afternoon
        </button>

        <button
          type="button"
          (click)="selectShift(StaffShift.Night)"
          [ngClass]="selectedShift === StaffShift.Night ? 'bg-blue-50 text-blue-600 border-blue-600' : 'bg-gray-50 text-gray-500 border-transparent'"
          class="flex-1 py-2.5 border-2 rounded-xl font-bold text-xs flex flex-col items-center gap-1 transition-all duration-200">
          <i class="fas fa-moon"></i> Night
        </button>
      </div>
    </div>

    <div class="flex gap-3 pt-4">
      <button type="button"
              (click)="onClose()"
              class="flex-1 px-6 py-3.5 bg-gray-100 text-gray-600 font-bold rounded-2xl hover:bg-gray-200 transition-all">
        Cancel
      </button>
      <button type="submit"
              (click)="onSubmit()"
              class="flex-1 px-6 py-3.5 bg-blue-600 text-white font-bold rounded-2xl hover:bg-blue-700 shadow-lg shadow-blue-200 transition-all active:scale-95">
        Save Staff
      </button>
    </div>
  </form>

</app-shared-modal>
