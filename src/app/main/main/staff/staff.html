<main class="min-h-screen bg-gray-50 pt-24 pb-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-7xl mx-auto">

    <div class="flex flex-col md:flex-row md:items-center justify-between mb-10 gap-4">
      <div>
        <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight">Staff Directory</h1>
        <p class="text-gray-500 mt-1">Manage your team and monitor duty shifts</p>
      </div>

      <div class="flex items-center gap-3">
        <div class="relative">
          <i class="fas fa-search absolute left-4 top-3.5 text-gray-400"></i>
          <input type="text"
                 placeholder="Search staff..."
                 class="pl-11 pr-4 py-2.5 bg-white border border-gray-200 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none w-64 shadow-sm transition-all">
        </div>
        <button class="bg-blue-600 text-white px-6 py-2.5 rounded-2xl font-bold hover:bg-blue-700 shadow-lg shadow-blue-200 transition-all flex items-center gap-2">
          <i class="fas fa-user-plus"></i> Add Staff
        </button>
      </div>
    </div>

    <div class="flex flex-col gap-4">
      <div *ngFor="let member of staffList" class="group bg-white rounded-3xl p-4 border border-gray-100 shadow-sm hover:shadow-md transition-all duration-300 flex flex-col md:flex-row md:items-center justify-between gap-6">

        <div class="flex items-center gap-5 md:w-1/3">
          <div class="relative flex-shrink-0">
            <img [src]="member.image" class="w-16 h-16 rounded-2xl object-cover shadow-sm group-hover:scale-105 transition-transform">
            <div class="absolute -bottom-1 -right-1 w-5 h-5 bg-white rounded-lg flex items-center justify-center shadow-sm border border-gray-50">
              <i [class]="'fas ' + getShiftIcon(member.shift) + ' text-[10px]'"></i>
            </div>
          </div>
          <div>
            <h3 class="text-lg font-bold text-gray-900 group-hover:text-blue-600 transition-colors">{{ member.name }}</h3>
            <p class="text-blue-600 font-bold text-xs uppercase tracking-wider">{{ member.role }}</p>
          </div>
        </div>

        <div class="grid grid-cols-2 md:flex md:items-center gap-8 md:w-1/3">
          <div class="flex items-center gap-3 text-gray-500">
            <div class="w-9 h-9 rounded-xl bg-gray-50 flex items-center justify-center text-gray-400">
              <i class="fas fa-building text-sm"></i>
            </div>
            <div>
              <p class="text-[10px] uppercase font-bold text-gray-400 leading-none mb-1">Dept</p>
              <p class="text-sm font-semibold text-gray-700">{{ member.department }}</p>
            </div>
          </div>

          <div class="flex items-center gap-3 text-gray-500">
            <div class="w-9 h-9 rounded-xl bg-gray-50 flex items-center justify-center text-gray-400">
              <i class="fas fa-clock text-sm"></i>
            </div>
            <div>
              <p class="text-[10px] uppercase font-bold text-gray-400 leading-none mb-1">Shift</p>
              <p class="text-sm font-semibold text-gray-700">{{ member.shift }}</p>
            </div>
          </div>
        </div>

        <div class="flex items-center justify-between md:justify-end gap-6 md:w-1/3">
          <span [class]="getStatusClass(member.status)" class="px-4 py-1.5 rounded-xl text-[10px] font-black uppercase tracking-widest ring-1 ring-inset">
            {{ member.status }}
          </span>

          <div class="flex items-center gap-2">
            <a [href]="'mailto:' + member.email" class="w-10 h-10 bg-gray-50 text-gray-400 flex items-center justify-center rounded-xl hover:bg-blue-50 hover:text-blue-600 transition-all">
              <i class="fas fa-envelope text-sm"></i>
            </a>
            <a [href]="'tel:' + member.phone" class="w-10 h-10 bg-gray-50 text-gray-400 flex items-center justify-center rounded-xl hover:bg-emerald-50 hover:text-emerald-600 transition-all">
              <i class="fas fa-phone text-sm"></i>
            </a>
            <button class="w-10 h-10 bg-gray-50 text-gray-400 flex items-center justify-center rounded-xl hover:bg-gray-900 hover:text-white transition-all">
              <i class="fas fa-ellipsis-v text-sm"></i>
            </button>
          </div>
        </div>

      </div>
    </div>

  </div>
</main>
