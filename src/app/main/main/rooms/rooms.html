<main class="min-h-screen bg-gray-50 pt-24 pb-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-7xl mx-auto">

    <div class="flex flex-col md:flex-row md:items-end justify-between mb-8 gap-4">
      <div>
        <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight">Room Inventory</h1>
        <p class="text-gray-500 mt-1">Manage and monitor your 48 available units</p>
      </div>

      <div class="flex items-center gap-2 bg-white p-1.5 rounded-2xl shadow-sm border border-gray-200">
        <button class="px-4 py-2 bg-blue-600 text-white rounded-xl text-sm font-bold shadow-md shadow-blue-100">All</button>
        <button class="px-4 py-2 text-gray-600 hover:bg-gray-50 rounded-xl text-sm font-medium transition-colors">Available</button>
        <button class="px-4 py-2 text-gray-600 hover:bg-gray-50 rounded-xl text-sm font-medium transition-colors">Cleaning</button>
        <div class="h-6 w-px bg-gray-200 mx-1"></div>
        <button class="p-2 text-gray-400 hover:text-blue-600">
          <i class="fas fa-th-large"></i>
        </button>
      </div>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
      <div *ngFor="let room of rooms" class="group bg-white rounded-3xl border border-gray-100 shadow-sm hover:shadow-xl transition-all duration-300 overflow-hidden">

        <div class="relative h-56 overflow-hidden">
          <img [src]="room.image" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500">
          <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent"></div>

          <div [class]="getStatusClass(room.status)" class="absolute top-4 right-4 px-3 py-1 rounded-full text-xs font-extrabold ring-1 ring-inset uppercase tracking-wider">
            {{ room.status }}
          </div>

          <div class="absolute bottom-4 left-4 text-white">
            <span class="text-xs font-bold uppercase tracking-widest opacity-80">{{ room.type }}</span>
            <h3 class="text-xl font-bold">Room {{ room.number }}</h3>
          </div>
        </div>

        <div class="p-6">
          <div class="flex justify-between items-center mb-4">
            <div class="flex gap-3">
              <i *ngFor="let icon of room.amenities" [class]="'fas fa-' + icon + ' text-gray-400 text-sm'" [title]="icon"></i>
            </div>
            <div class="text-right">
              <span class="text-2xl font-black text-blue-600">{{ room.price }}</span>
              <span class="text-xs text-gray-400 block font-bold">/ NIGHT</span>
            </div>
          </div>

          <div class="flex gap-3">
            <button class="flex-[2] bg-gray-900 text-white py-3 rounded-2xl font-bold hover:bg-blue-600 transition-all active:scale-95 flex items-center justify-center gap-2">
              <i class="fas fa-info-circle"></i> View Details
            </button>
            <button class="flex-1 bg-gray-50 text-gray-400 py-3 rounded-2xl font-bold hover:bg-rose-50 hover:text-rose-600 transition-all">
              <i class="fas fa-ellipsis-h"></i>
            </button>
          </div>
        </div>
      </div>
    </div>

  </div>
</main>
