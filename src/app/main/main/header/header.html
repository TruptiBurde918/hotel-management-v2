<header class="fixed top-0 left-0 w-full z-50 bg-white/90 backdrop-blur-md shadow-sm border-b border-gray-100">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between h-20 items-center">

      <div class="flex items-center gap-2 cursor-pointer">
        <div class="w-10 h-10 bg-blue-600 rounded-lg flex items-center justify-center text-white">
          <i class="fas fa-hotel text-xl"></i>
        </div>
        <span class="text-2xl font-extrabold tracking-tight text-gray-900 uppercase">
          Luxe<span class="text-blue-600">Stay</span>
        </span>
      </div>

      <nav class="hidden md:flex space-x-8">
        <a *ngFor="let item of navItems"
                   class="text-gray-600 hover:text-blue-600 font-medium transition-colors flex items-center gap-2 cursor-pointer">
          <i [class]="item.icon"></i> {{ item.label }}
        </a>
      </nav>

      <div class="flex items-center gap-2 md:gap-4">
         <button (click)="openBookingModal()" class="bg-blue-600 text-white px-4 md:px-6 py-2.5 rounded-full font-bold hover:bg-blue-700 shadow-lg shadow-blue-200 transition-all active:scale-95">
    <i class="fas fa-plus md:mr-2"></i>
    <span class="hidden md:inline">New Booking</span>
  </button>


        <button (click)="toggleMenu()" class="md:hidden p-2 text-gray-600 hover:bg-gray-100 rounded-lg transition-colors focus:outline-none">
          <i class="fas" [ngClass]="isMenuOpen ? 'fa-times' : 'fa-bars'"></i>
        </button>
      </div>

    </div>
  </div>

  <div *ngIf="isMenuOpen" class="md:hidden bg-white border-b border-gray-100">
    <div class="px-4 pt-2 pb-6 space-y-1">
      <a *ngFor="let item of navItems"
         (click)="isMenuOpen = false"
         class="flex items-center gap-3 px-4 py-3 text-gray-600 hover:text-blue-600 hover:bg-blue-50 rounded-xl font-medium transition-all cursor-pointer">
        <i [class]="item.icon + ' w-5 text-center'"></i>
        {{ item.label }}
      </a>
    </div>
  </div>
</header>

<app-booking-modal
  [isOpen]="isBookingModalOpen"
  (close)="isBookingModalOpen = false">
</app-booking-modal>
