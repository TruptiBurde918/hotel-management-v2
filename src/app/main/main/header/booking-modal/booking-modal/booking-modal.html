<app-shared-modal
  [isOpen]="isOpen"
  title="Create New Booking"
  (closeExited)="onClose()">

  <form class="space-y-5">
    <div>
      <label class="block text-sm font-bold text-gray-700 mb-1.5">Full Name</label>
      <div class="relative">
        <i class="fas fa-user absolute left-4 top-3.5 text-gray-400"></i>
        <input type="text"
               class="w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none"
               placeholder="John Doe">
      </div>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-bold text-gray-700 mb-1.5">Room Type</label>
        <select class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
          <option>Single Standard</option>
          <option>Double Deluxe</option>
          <option>Family Suite</option>
        </select>
      </div>
      <div>
        <label class="block text-sm font-bold text-gray-700 mb-1.5">Price</label>
        <div class="relative">
          <span class="absolute left-4 top-3 text-gray-500 font-bold text-sm">USD</span>
          <input type="number" class="w-full pl-14 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" placeholder="0.00">
        </div>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-bold text-gray-700 mb-1.5">Check In</label>
        <input type="date" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
      </div>
      <div>
        <label class="block text-sm font-bold text-gray-700 mb-1.5">Check Out</label>
        <input type="date" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
      </div>
    </div>

    <div class="flex gap-3 pt-2">
      <button type="button"
              (click)="onClose()"
              class="flex-1 px-6 py-3 border border-gray-200 text-gray-600 font-bold rounded-xl hover:bg-gray-50 transition-colors">
        Cancel
      </button>
      <button type="submit"
              (click)="onSubmit()"
              class="flex-1 px-6 py-3 bg-blue-600 text-white font-bold rounded-xl hover:bg-blue-700 shadow-lg shadow-blue-200 transition-all active:scale-95">
        Confirm
      </button>
    </div>
  </form>

</app-shared-modal>
